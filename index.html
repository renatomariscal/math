<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplication Game</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #6366f1;
    --accent-glow: #818cf8;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
  }

  body {
    font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 540px;
    padding: 2rem;
  }

  h1 {
    font-size: 1.6rem;
    text-align: center;
    margin-bottom: 2rem;
    color: var(--accent-glow);
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 1.5rem;
  }

  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.4rem;
  }

  input[type="number"], input[type="text"], select {
    width: 100%;
    padding: 0.6rem 0.8rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus { border-color: var(--accent); }

  .row {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .row > div { flex: 1; }
  .row > div { min-width: 0; }

  .option { margin-bottom: 1rem; }
  .sound-option { text-transform: none; letter-spacing: normal; }
  .hint { color: var(--muted); font-size: 0.8rem; line-height: 1.5; margin: 0.8rem 0; }
  .game-info { text-align: center; margin-bottom: 0.8rem; }
  .points { color: var(--accent-glow); font-weight: 700; }

  .btn {
    display: block;
    width: 100%;
    padding: 0.8rem;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
  }

  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-glow); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); margin-top: 0.8rem; }
  .btn-outline:hover { border-color: var(--muted); color: var(--text); }

  /* Game screen */
  .timer-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 1.5rem;
  }

  .timer-fill {
    height: 100%;
    background: var(--accent);
    transition: width 1s linear, background-color 0.3s;
    width: 100%;
  }

  .timer-fill.warn { background: var(--yellow); }
  .timer-fill.danger { background: var(--red); }

  .timer-text {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .problem {
    text-align: center;
    font-size: 3rem;
    font-weight: 700;
    padding: 1rem 0;
    letter-spacing: 0.05em;
  }

  .problem .op { color: var(--muted); margin: 0 0.3rem; }

  #answer {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    padding: 0.8rem;
    margin-top: 1rem;
    letter-spacing: 0.1em;
  }

  .feedback {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    min-height: 2rem;
    line-height: 2rem;
    margin-top: 0.5rem;
    transition: opacity 0.2s;
  }

  .feedback.correct { color: var(--green); }
  .feedback.wrong { color: var(--red); }

  .stats-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: space-around;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  .stat { text-align: center; }
  .stat-value { font-size: 1.4rem; font-weight: 700; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.2rem; }

  /* Results */
  .result-big {
    text-align: center;
    font-size: 3rem;
    font-weight: 700;
    color: var(--accent-glow);
    margin-bottom: 0.5rem;
  }

  .result-sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }

  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .result-card {
    background: var(--bg);
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
  }

  .result-card .stat-value { font-size: 1.6rem; }

  .hidden { display: none !important; }

  .shake {
    animation: shake 0.3s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .pop {
    animation: pop 0.25s ease-out;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<div class="container">

  <!-- SETUP SCREEN -->
  <div id="setup">
    <h1>× MULTIPLY</h1>
    <div class="card">
      <div class="option">
        <label for="mode">Practice mode</label>
        <select id="mode">
          <option value="mixed">Mixed round</option>
          <option value="fixed">One times table</option>
          <option value="random">Any × any (0–10)</option>
        </select>
        <p class="hint" id="modeHint"></p>
      </div>
      <div class="row">
        <div id="fixedOption">
          <label for="fixedNum">Fixed number</label>
          <input type="number" id="fixedNum" value="4" min="0" max="99">
        </div>
        <div>
          <label for="timerMin">Timer (min)</label>
          <input type="number" id="timerMin" value="10" min="1" max="30">
        </div>
      </div>
      <div class="row" id="rangeOptions">
        <div>
          <label for="rangeMin">Range min</label>
          <input type="number" id="rangeMin" value="0" min="0" max="99">
        </div>
        <div>
          <label for="rangeMax">Range max</label>
          <input type="number" id="rangeMax" value="10" min="0" max="99">
        </div>
      </div>
      <label class="sound-option"><input type="checkbox" id="sound"> Play sounds</label>
      <p class="hint" id="progress"></p>
      <button class="btn btn-primary" id="startBtn">Start Game</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game" class="hidden">
    <p class="game-info" id="stage" aria-live="polite"></p>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    <div class="timer-text" id="timerText">5:00</div>
    <div class="card">
      <div class="problem" id="problem">
        <span id="numA">4</span>
        <span class="op" id="operator">×</span>
        <span id="numB">7</span>
        <span class="op">=</span>
      </div>
      <input type="text" id="answer" inputmode="numeric" autocomplete="off" placeholder="?" aria-label="Your answer">
      <div class="feedback" id="feedback" role="status"></div>
      <p class="game-info points"><span id="points">0</span> points · <span id="streak">0</span> streak</p>
      <div class="stats-row">
        <div class="stat">
          <div class="stat-value green" id="correctCount">0</div>
          <div class="stat-label">Correct</div>
        </div>
        <div class="stat">
          <div class="stat-value red" id="wrongCount">0</div>
          <div class="stat-label">Wrong</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="perMin">0.0</div>
          <div class="stat-label">Per min</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="accuracy">—</div>
          <div class="stat-label">Accuracy</div>
        </div>
      </div>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results" class="hidden">
    <h1>× MULTIPLY</h1>
    <div class="card">
      <div class="result-big" id="finalScore">0</div>
      <div class="result-sub">problems solved correctly</div>
      <p class="game-info points" id="finalPoints"></p>
      <p class="game-info hint" id="finalStreak"></p>
      <div class="results-grid">
        <div class="result-card">
          <div class="stat-value" id="finalTotal">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="result-card">
          <div class="stat-value" id="finalAccuracy">0%</div>
          <div class="stat-label">Accuracy</div>
        </div>
        <div class="result-card">
          <div class="stat-value" id="finalPerMin">0.0</div>
          <div class="stat-label">Per minute</div>
        </div>
        <div class="result-card">
          <div class="stat-value red" id="finalWrong">0</div>
          <div class="stat-label">Wrong</div>
        </div>
      </div>
      <button class="btn btn-primary" id="restartBtn">Play Again</button>
      <button class="btn btn-outline" id="reconfigBtn">Change Settings</button>
    </div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const storageKey = 'multiply-progress-v1';
const settingsIds = ['mode', 'fixedNum', 'rangeMin', 'rangeMax', 'timerMin'];
const stageLength = 2 * 60 * 1000;
const mistakePenalty = 10;
const stages = ['fixed', 'random', 'addition'];

let saved;
try {
  saved = JSON.parse(localStorage.getItem(storageKey));
} catch {
  // Storage can be unavailable in private or restricted browsing.
}

const progress = saved?.progress ?? { rounds: 0, bestPoints: 0, facts: {} };
let round = saved?.round ?? null;
let lastResult = saved?.lastResult ?? null;
let deadline, timerInterval, nextTimer, audio;

function save() {
  const settings = Object.fromEntries(settingsIds.map(id => [id, $(id).value]));
  settings.sound = $('sound').checked;
  try {
    localStorage.setItem(storageKey, JSON.stringify({ settings, progress, round, lastResult }));
  } catch {
    $('progress').textContent = 'Browser storage is unavailable. Progress lasts until you close or reload this page.';
  }
}

function show(id) {
  for (const screen of ['setup', 'game', 'results']) {
    $(screen).classList.toggle('hidden', screen !== id);
  }
}

function updateSetup() {
  const mode = $('mode').value;
  $('fixedOption').classList.toggle('hidden', mode === 'random');
  $('rangeOptions').classList.toggle('hidden', mode === 'random');
  $('modeHint').textContent = {
    mixed: 'Switch activities every 2 minutes: one times table, any × any, then an addition break.',
    fixed: 'Practice one times table. Trickier facts come up a little more often.',
    random: 'Both factors can be any number from 0 to 10.'
  }[mode];
  $('progress').textContent = progress.rounds
    ? `Rounds finished: ${progress.rounds} · Best score: ${progress.bestPoints} points`
    : 'Earn the product in points for a correct answer. Addition earns the sum. A miss costs up to 10 points.';
}

function settingNumber(id) {
  const input = $(id);
  const value = Number.isFinite(input.valueAsNumber) ? input.valueAsNumber : Number(input.defaultValue);
  return Math.min(Number(input.max), Math.max(Number(input.min), Math.trunc(value)));
}

function stageIndex() {
  return round.mode === 'mixed' ? Math.floor((round.duration - round.remaining) / stageLength) : 0;
}

function stageMode(index) {
  return round.mode === 'mixed' ? stages[index % stages.length] : round.mode;
}

function factKey(a, b) {
  return `${Math.min(a, b)}×${Math.max(a, b)}`;
}

function pick(items) {
  return items[Math.floor(Math.random() * items.length)];
}

function chooseProblem(mode) {
  const candidates = [];
  const firstMin = mode === 'fixed' ? round.fixed : 0;
  const firstMax = mode === 'fixed' ? round.fixed : 10;
  const secondMin = mode === 'fixed' ? round.min : 0;
  const secondMax = mode === 'fixed' ? round.max : 10;

  for (let a = firstMin; a <= firstMax; a++) {
    for (let b = secondMin; b <= secondMax; b++) {
      const key = mode === 'addition' ? `${Math.min(a, b)}+${Math.max(a, b)}` : factKey(a, b);
      candidates.push({ a, b, key, mode });
    }
  }

  // Prefer avoiding the last three facts. Relax that only for small ranges.
  let eligible = candidates.filter(problem => !round.recent.includes(problem.key));
  for (let i = 1; !eligible.length; i++) {
    eligible = candidates.filter(problem => !round.recent.slice(i).includes(problem.key));
  }

  // Reserve a quarter of draws for review, with a capped weight per fact.
  if (mode !== 'addition' && Math.random() < 0.25) {
    const review = new Map();
    for (const problem of eligible) {
      const weight = progress.facts[problem.key] || 0;
      if (weight && !review.has(problem.key)) review.set(problem.key, { problem, weight });
    }
    const weighted = [...review.values()].flatMap(({ problem, weight }) => Array(weight).fill(problem));
    if (weighted.length) {
      const selected = pick(weighted);
      return pick(eligible.filter(problem => problem.key === selected.key));
    }
  }
  return pick(eligible);
}

function showProblem() {
  const index = stageIndex();
  const mode = stageMode(index);
  round.problem ??= { ...chooseProblem(mode), index };
  const { a, b } = round.problem;
  const activity = {
    fixed: `${round.fixed} times table`,
    random: 'Any × any',
    addition: 'Addition break'
  }[round.problem.mode];
  $('stage').textContent = round.mode === 'mixed'
    ? `Stage ${round.problem.index + 1} of ${Math.ceil(round.duration / stageLength)} · ${activity}`
    : activity;
  $('numA').textContent = a;
  $('numB').textContent = b;
  $('operator').textContent = round.problem.mode === 'addition' ? '+' : '×';
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('problem').classList.remove('pop');
  $('answer').classList.remove('shake');
  $('answer').value = '';
  save();
}

function roundStats(result) {
  const total = result.correct + result.wrong;
  const minutes = (result.duration - result.remaining) / 60000;
  return {
    total,
    accuracy: total ? Math.round(result.correct / total * 100) + '%' : '—',
    rate: minutes > 0 ? (total / minutes).toFixed(1) : '0.0'
  };
}

function updateStats() {
  const { accuracy, rate } = roundStats(round);
  $('correctCount').textContent = round.correct;
  $('wrongCount').textContent = round.wrong;
  $('perMin').textContent = rate;
  $('accuracy').textContent = accuracy;
  $('points').textContent = round.points;
  $('streak').textContent = round.streak;
}

function updateTimer(advanceStage = false) {
  const previousSecond = Math.ceil(round.remaining / 1000);
  round.remaining = Math.max(0, deadline - Date.now());
  if (!round.remaining) {
    endGame();
    return;
  }

  const seconds = Math.ceil(round.remaining / 1000);
  const percent = round.remaining / round.duration * 100;
  $('timerText').textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  const fill = $('timerFill');
  fill.style.width = percent + '%';
  fill.classList.toggle('warn', percent < 30 && percent >= 10);
  fill.classList.toggle('danger', percent < 10);
  updateStats();
  if (advanceStage && round.problem && stageIndex() !== round.problem.index && !$('answer').value.trim()) {
    round.problem = null;
    playSound('stage');
    showProblem();
  }
  if (seconds !== previousSecond) save();
}

function playSound(kind) {
  if (!audio || audio.state !== 'running') return;
  const notes = {
    correct: [523, 659],
    wrong: [294],
    streak: [523, 659, 784],
    stage: [440, 587, 784],
    finish: [523, 659, 784, 1047]
  }[kind];
  notes.forEach((frequency, index) => {
    const at = audio.currentTime + index * 0.09;
    const tone = audio.createOscillator();
    const volume = audio.createGain();
    tone.type = 'sine';
    tone.frequency.value = frequency;
    volume.gain.setValueAtTime(0.001, at);
    volume.gain.exponentialRampToValueAtTime(0.08, at + 0.02);
    volume.gain.exponentialRampToValueAtTime(0.001, at + 0.13);
    tone.connect(volume).connect(audio.destination);
    tone.start(at);
    tone.stop(at + 0.14);
  });
}

function unlockSound() {
  if (!$('sound').checked) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  audio ??= new AudioContext();
  if (audio.state === 'suspended') audio.resume().catch(() => {});
}

function resumeRound() {
  deadline = Date.now() + round.remaining;
  show('game');
  showProblem();
  $('answer').focus();
  updateTimer();
  if (round) timerInterval = setInterval(() => updateTimer(true), 250);
}

function startGame() {
  if (round) return;
  unlockSound();

  const fixed = settingNumber('fixedNum');
  const timer = settingNumber('timerMin');
  const range = [settingNumber('rangeMin'), settingNumber('rangeMax')].sort((a, b) => a - b);
  const [min, max] = range;
  $('fixedNum').value = fixed;
  $('timerMin').value = timer;
  $('rangeMin').value = min;
  $('rangeMax').value = max;
  const duration = timer * 60000;
  round = {
    mode: $('mode').value, fixed, min, max, duration, remaining: duration,
    correct: 0, wrong: 0, points: 0, streak: 0, bestStreak: 0, recent: [], problem: null
  };
  lastResult = null;
  resumeRound();
}

function showResults() {
  const { total, accuracy, rate } = roundStats(lastResult);
  $('finalScore').textContent = lastResult.correct;
  $('finalTotal').textContent = total;
  $('finalAccuracy').textContent = accuracy;
  $('finalPerMin').textContent = rate;
  $('finalWrong').textContent = lastResult.wrong;
  $('finalPoints').textContent = `${lastResult.points} points · Best: ${progress.bestPoints}`;
  $('finalStreak').textContent = `Longest streak: ${lastResult.bestStreak}`;
  show('results');
  $('restartBtn').focus();
}

function endGame() {
  clearInterval(timerInterval);
  clearTimeout(nextTimer);
  progress.rounds++;
  progress.bestPoints = Math.max(progress.bestPoints, round.points);
  lastResult = round;
  round = null;
  save();
  playSound('finish');
  showResults();
}

function checkAnswer(automatic) {
  if (!round?.problem) return;
  const value = $('answer').value.trim();
  if (!/^\d+$/.test(value)) return;

  const { a, b, key, mode, index } = round.problem;
  const addition = mode === 'addition';
  const answer = addition ? a + b : a * b;
  if (automatic && value.length < String(answer).length) return;
  updateTimer();
  if (!round) return;

  const correct = Number(value) === answer;
  // Clearing the problem blocks resubmission while keeping the field editable for mobile keyboards.
  round.problem = null;
  round.recent = [...round.recent, key].slice(-3);

  if (!addition) {
    const weight = progress.facts[key] || 0;
    const nextWeight = correct ? Math.max(0, weight - 1) : Math.min(5, weight + 2);
    if (nextWeight) progress.facts[key] = nextWeight;
    else delete progress.facts[key];
  }

  let milestone = false;
  if (correct) {
    round.correct++;
    round.points += answer;
    round.streak++;
    round.bestStreak = Math.max(round.bestStreak, round.streak);
    milestone = round.streak % 5 === 0;
    $('feedback').textContent = milestone ? `★ ${round.streak} in a row! +${answer}` : `✓ Correct! +${answer}`;
    $('problem').classList.add('pop');
  } else {
    round.wrong++;
    round.streak = 0;
    const deduction = Math.min(round.points, mistakePenalty);
    round.points -= deduction;
    $('feedback').textContent = `${a} ${addition ? '+' : '×'} ${b} = ${answer} · −${deduction} pts`;
    $('answer').classList.add('shake');
  }
  $('feedback').className = correct ? 'feedback correct' : 'feedback wrong';
  playSound(milestone ? 'streak' : correct ? 'correct' : 'wrong');
  updateStats();
  save();
  nextTimer = setTimeout(() => {
    updateTimer();
    if (!round) return;
    if (stageIndex() !== index) playSound('stage');
    showProblem();
  }, correct ? 450 : 1100);
}

for (const id of settingsIds) {
  if (saved?.settings?.[id] !== undefined) $(id).value = saved.settings[id];
  $(id).addEventListener('input', () => {
    updateSetup();
    save();
  });
}
$('sound').checked = saved?.settings?.sound ?? false;
$('sound').addEventListener('change', save);
$('answer').addEventListener('input', () => checkAnswer(true));
$('answer').addEventListener('keydown', event => {
  unlockSound();
  if (event.key === 'Enter') {
    event.preventDefault();
    checkAnswer(false);
  }
});
$('answer').addEventListener('pointerdown', unlockSound);
$('startBtn').addEventListener('click', startGame);
$('restartBtn').addEventListener('click', startGame);
$('reconfigBtn').addEventListener('click', () => {
  lastResult = null;
  updateSetup();
  show('setup');
  save();
  $('mode').focus();
});
$('setup').addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.type === 'number') startGame();
});
window.addEventListener('pagehide', () => {
  if (round) updateTimer();
  save();
});
window.addEventListener('pageshow', event => {
  if (event.persisted && round) deadline = Date.now() + round.remaining;
});

updateSetup();
if (round) resumeRound();
else if (lastResult) showResults();
</script>
</body>
</html>
